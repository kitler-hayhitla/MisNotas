name: Compilar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: node fetch-fonts.js
      - run: npm run prep
      - run: npx cap add android
      - name: Permiso de cámara (fotos de evidencias)
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' $f
          grep -c CAMERA $f
      - name: Plugin para guardar archivos en el teléfono
        run: cp native-android/*.java android/app/src/main/java/com/misnotas/app/
      - run: npx cap sync android
      - name: Usar la misma firma en cada compilación
        run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - name: Compilar
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mis-notas-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
