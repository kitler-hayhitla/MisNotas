<!DOCTYPE html>
<!--
  MN_V194  (parte de MN_V193, 25/11/2026)
  - El color de la materia ahora solo se muestra en el Horario y en la gráfica «Evolución de todas las materias», y es el mismo en ambos (incluido el reemplazo automático cuando choca con el color de estado). Se quitó el punto de color de la materia en «Clases de hoy» (Inicio).
  Próxima versión: MN_V195.

  MN_V193  (parte de MN_V192, 25/11/2026)
  - Horario: los pendientes con hora de apertura y cierre ahora también se muestran en el Horario (vista Semana y vista Día), en el día de la semana actual que corresponde a su fecha. Aparecen como un bloque con 📌, del color de su materia y con la línea izquierda del color de estado de la materia (igual que las clases); al tocarlo se abre el pendiente. Si se cruzan con una clase, comparten el espacio lado a lado. Se amplía el rango de horas y los días (Sáb/Dom) si hace falta.
  Próxima versión: MN_V194.

  MN_V192  (parte de MN_V191, 25/11/2026)
  - Pendientes: nueva opción «+ Hora de apertura y cierre» (opcional, requiere fecha). Sirve para parciales o entregas que abren y cierran a cierta hora. Se muestra en Pendientes, Inicio > «Lo que sigue», bajo cada clase y en los pendientes de un grupo; el mismo día indica «abierto ahora» o «cerrado» (y un pendiente cerrado y sin hacer se marca en rojo). Los pendientes del mismo día se ordenan por hora de apertura. Los datos anteriores siguen funcionando igual.
  Próxima versión: MN_V193.

  MN_V191  (parte de MN_V190, 25/11/2026)
  - Editar/Nueva clase: la etiqueta «Salón o nota (opcional)» ahora dice «Salón o apunte (opcional)».
  Próxima versión: MN_V192.

  MN_V189  (parte de MN_V188, 25/11/2026)
  - Tutorial rediseñado: barra de progreso por pasos (tocable), categoría de cada paso, ilustración, texto corto y un consejo; navegación también deslizando o con las flechas. Contenido actualizado (13 pasos): estados y colores, evidencias, apuntes, horario (tocar/mantener, horas comprimidas), gráficas, diez estilos especiales, exportar y compartir.
  Próxima versión: MN_V190.

  MN_V188  (parte de MN_V186, 25/11/2026)
  - Cuaderno: efecto de las gráficas rediseñado. Un lápiz dibuja a mano la línea (trazo de tinta con ligera variación y temblor), hace un círculo a mano en cada punto con una pequeña mancha de tinta, y el dibujo queda fijo como imagen al terminar. Sin partículas sueltas.
  - Corregido un cierre/crash: el cambio de clases del SVG al terminar volvía a disparar la animación en bucle; ahora usa un atributo data-ci.
  - No incluye el rediseño de Pizarra de MN_V187 (se había hecho por error en lugar de Cuaderno).
  Próxima versión: MN_V189.

  MN_V186  (parte de MN_V185, 25/11/2026)
  - Gráficas en Pizarra y Lápiz: la región del filtro ahora es fija (userSpaceOnUse). Antes, un tramo plano (p. ej. 3.50 → 3.50) tenía altura 0 y el filtro lo hacía desaparecer, por eso la línea no llegaba al último corte. Además se suavizó el desgaste de tiza para que la línea no se rompa en fragmentos al repetir la animación.
  Próxima versión: MN_V187.

  MN_V185  (parte de MN_V184, 24/11/2026)
  - Horario semanal: intensidad intermedia entre V183 y V184 (color de la materia mezclado ~50% con el fondo de la tarjeta, texto del color normal del tema, sin sombra).
  Próxima versión: MN_V186.

  MN_V184  (parte de MN_V183, 24/11/2026)
  - Horario semanal: bloques con color vivo (degradado del color de la materia) y texto blanco, o oscuro si el color es muy claro.
  Próxima versión: MN_V185.

  MN_V183  (parte de MN_V182, 24/11/2026)
  - Horario semanal: bloques con fondo translúcido del color de la materia y línea de estado a la izquierda; las horas sin clases en ningún día se comprimen (⋯); cuadrícula más tenue y columna de hoy con fondo suave. Los temas especiales conservan su estilo.
  Próxima versión: MN_V184.

  MN_V182  (parte de MN_V181, 24/11/2026)
  - Horario: ninguna materia (ni actividad sin materia) comparte color con otra; si dos tienen colores iguales o muy parecidos, a la segunda se le asigna uno distinto. Además sigue evitando el color de estado.
  Próxima versión: MN_V183.

  MN_V181  (parte de MN_V180, 24/11/2026)
  - Los colores de reemplazo por contraste con el estado ya no se repiten: cada materia que cambia recibe uno distinto que tampoco coincide con el de otra materia.
  Próxima versión: MN_V182.

  MN_V180  (parte de MN_V179, 24/11/2026)
  - Se quitó la franja clara del Horario semanal. Ahora, si el color de la materia es parecido al color de estado de su línea (azul, rojo, naranja, verde), se muestra automáticamente un color que contraste (rosa, morado, turquesa...) en el bloque, el aro de Inicio y el punto de la vista por día. El color elegido no se modifica.
  Próxima versión: MN_V181.

  MN_V179  (parte de MN_V178, 24/11/2026)
  - Inicio > «Clases de hoy»: el color de la materia ya no es un punto junto al nombre; ahora es un círculo con aro al final de la fila. La línea izquierda sigue siendo el estado.
  - Horario semanal: separador claro entre la línea de estado y el color del bloque, para que no se confundan cuando comparten tono (p. ej. naranja de Cálculo II y Difícil).
  Próxima versión: MN_V180.

  MN_V178  (parte de MN_V177, 24/11/2026)
  - Horario: la línea izquierda de cada clase toma el color del estado de su materia (verde Asegurada/Aprobada, azul En curso, naranja Difícil, rojo Perdida/Reprobada, gris Sin notas) en la vista del día, en «Clases de hoy» y en la vista semanal. El color propio de la clase se conserva en un punto junto al nombre (día e Inicio) y en el fondo del bloque (semana). Se quitaron la etiqueta y el punto de estado de MN_V177.
  Próxima versión: MN_V179.

  MN_V176  (parte de MN_V175, 24/11/2026)
  - Inicio > «Lo que sigue»: ya no repite los pendientes que aparecen en «Clases de hoy»; muestra los siguientes (sin clase vinculada, de mañana o posteriores).

  MN_V175  (parte de MN_V174, 24/11/2026)
  - Pendientes: el grupo «Hechos» se separa en «Hechos sin nota» y «Hechos con nota» (los que ya tienen nota registrada).

  MN_V174  (parte de MN_V173, 24/11/2026)
  - Pendientes: al editar un pendiente ahora se puede cambiar la materia (si cambia, lo seguirán sus apuntes ligados; también funciona al asignarlo a un grupo de la nueva materia). Con nota registrada la materia sigue bloqueada.
  - Tema Lingote: corregida la superposición al cambiar de pestaña dentro de una pantalla (Notas/Pendientes/Apuntes). El contenido nuevo ahora queda oculto hasta que el barrido pasa por él, sincronizado con la misma curva del barrido (solo opacity, sin costo extra en gama baja).

  MN_V173  (parte de MN_V172, 24/11/2026)
  - Inicio > "Lo que sigue" ahora siempre abre la pestaña Pendientes (antes abría Apuntes si esa era la última vista usada).

  MN_V172  (parte de MN_V171, 23/11/2026)
  Cambios respecto a MN_V171:
  - Tema Bosque: transición ligera (velo de hojas con transform; sin clones ni canvas en gama baja o si va lenta) y menos partículas en gama media/alta.
  - Bosque gama baja: sin niebla animada y sombras de tarjeta más simples.
  - Promedio grande del resumen (.hv): color de texto normal salvo en temas especiales.
  - Tipografía: estándar por defecto (Public Sans); manuscrita solo en Cuaderno, Cielo, Pizarra y Océano.
  - Ajustes > Apariencia: menú desplegable de tipografía (Estándar, Manuscrita, Serif, Redondeada, Elegante, Legible, Monoespaciada); se guarda en PF.font.
  - Tema Neón: fondo sin el degradado magenta (--ac2 ahora sigue al acento).
-->

function clDraw(){var p=DDP;

  el.innerHTML=d.o.map(function(p,i){var on=String(p[0])===inp.value;return '<div class="ddo'+(on?" on":"")+'" role="option" aria-selected="'+on+'" data-i="'+i+'"><span>'+esc(p[1])+'</span>'+(on?DCHK:"")+'</div>'}).join("");

function ddClick(e){var p=DDP;if(!p)return;

<script>
/* Horario semanal: "hoy" toma el ancho que necesita su texto; los demás días comparten el resto con el mismo ancho */
(function(){
  var MINW=40;
  function need(c,cv){
    var n=MINW;
    c.querySelectorAll(".hwb").forEach(function(b){
      var bb=b.querySelector("b"),sp=b.querySelector("span");if(!bb||!sp)return;
      var a=getComputedStyle(bb),lw=0;cv.font=a.fontWeight+" "+a.fontSize+" "+a.fontFamily;
      bb.textContent.split(/\s+/).forEach(function(w){lw=Math.max(lw,cv.measureText(w).width)});
      var full=cv.measureText(bb.textContent).width;
      var z=getComputedStyle(sp);cv.font=z.fontWeight+" "+z.fontSize+" "+z.fontFamily;
      var inf=cv.measureText(sp.textContent).width;
      var w=Math.max(lw,full/2,inf/2)*1.1+16,pct=parseFloat(b.style.width)||100;
      n=Math.max(n,w*100/pct);
    });
    return n;
  }
  function fit(h){
    var cols=Array.prototype.slice.call(h.querySelectorAll(".hwc"));if(!cols.length)return;
    var axis=h.querySelector(".hwa"),A=h.clientWidth-(axis?axis.offsetWidth:24);if(A<=0)return;
    var cv=document.createElement("canvas").getContext("2d");
    var ai=-1;cols.forEach(function(c,i){if(c.querySelector(".hwh.hoy"))ai=i});if(ai<0){cols.forEach(function(c){c.style.flex="1 1 0px"});return}
    var wt=Math.min(Math.max(need(cols[ai],cv),64),A*0.55);
    var R=A-wt,ws=[],sum=0;
    cols.forEach(function(c,i){
      var w=i===ai?0:1;
      ws.push(w);sum+=w;
    });
    cols.forEach(function(c,i){
      var px=i===ai?wt:Math.max(MINW,R*ws[i]/(sum||1));
      c.style.flex=px.toFixed(1)+" 1 0px";
    });
  }
  function run(h){h.setAttribute("data-fit","1");fit(h);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){fit(h)})}
  new MutationObserver(function(){var h=document.querySelector(".hw:not([data-fit])");if(h)run(h)}).observe(document.body,{childList:true,subtree:true});
  window.addEventListener("resize",function(){var h=document.querySelector(".hw");if(h)fit(h)});
})();
</script>
